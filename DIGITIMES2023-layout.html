    --bg: #ffffff;
    --divider: #e8e8e8;
    --text-primary: #111111;
    --text-secondary: #666666;
    --text-muted: #aaaaaa;
    --nav-h: 44px;

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    overflow: hidden;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #fff;
    z-index: 100;
  }

  .nav-breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    letter-spacing: 0.01em;
  }
  .nav-breadcrumb a { color: var(--text-secondary); text-decoration: none; transition: color .15s; }
  .nav-breadcrumb a:hover { color: var(--text-primary); }
  .nav-sep { color: #ddd; }

  .nav-home {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    text-decoration: none;
    transition: color .15s;
  }
  .nav-home:hover { color: var(--text-primary); }
  .nav-home svg { width: 14px; height: 14px; }

  .layout {
    display: flex;
    height: 100vh;
    padding-top: var(--nav-h);
  }

  .viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
  }

  .single-view {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }

  /* 長條圖模式：可捲動 */
  .single-view.tall-mode {
    align-items: flex-start;
    overflow-y: auto;
    padding: 0;
    scrollbar-width: thin;
    scrollbar-color: #ddd transparent;
  }
  .single-view.tall-mode::-webkit-scrollbar { width: 4px; }
  .single-view.tall-mode::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  .single-view img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    opacity: 0;
    transition: opacity .3s ease;
    border-radius: 16px;
  }
  .single-view img.loaded { opacity: 1; }

  /* 長條圖模式下 img 橫向填滿 */
  .single-view.tall-mode img {
    width: 100%;
    max-height: none;
    object-fit: contain;
    border-radius: 16px;
  }

  /* scroll hint：fixed 懸浮在圖片區下方 */
  .scroll-hint {
    position: fixed;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 50;
    opacity: 1;
    transition: opacity .4s ease;
  }
  .scroll-hint.hidden { opacity: 0; }

  .scroll-hint-inner {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.08em;
    padding: 5px 12px;
    border-radius: 20px;
  }
  .scroll-hint-inner svg {
    width: 10px; height: 10px;
    animation: bounceDown .9s ease-in-out infinite;
  }
  @keyframes bounceDown {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(3px); }
  }

  .grid-view {
    flex: 1;
    overflow: hidden;
    padding: 16px 16px 0;
    display: none;
    flex-direction: column;
    background: #fff;
  }
  .grid-view.active { display: flex; }

  .grid-page {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 20px;
    flex: 1;
    min-height: 0;
  }

  .grid-thumb {
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: opacity .15s;
    min-height: 0;
  border-radius: 10px;
  }
  .grid-thumb:hover { opacity: 0.75; }
  .grid-thumb.active img { outline: 1.5px solid #111; outline-offset: -1.5px; }
  .grid-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid-thumb .thumb-num {
    position: absolute;
    bottom: 4px; right: 5px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 300;
    color: rgba(0,0,0,0.4);
    background: rgba(255,255,255,0.7);
    padding: 1px 4px;
  }

  .viewer-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #fff;
    flex-shrink: 0;
  }

  .nav-arrows { display: flex; align-items: center; gap: 8px; }

  .arrow-btn {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    color: var(--text-muted); cursor: pointer;
    transition: color .15s; padding: 0;
  }
  .arrow-btn:hover:not(:disabled) { color: var(--text-primary); }
  .arrow-btn:disabled { opacity: 0.25; cursor: default; }

  .page-counter {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    min-width: 52px; text-align: center;
  }
  .page-counter .cur { color: var(--text-primary); }

  /* Category badge next to counter */
  .page-category {
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  .view-toggle { display: flex; gap: 2px; }

  .toggle-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    color: var(--text-muted); cursor: pointer;
    transition: color .15s; border-radius: 3px;
  }
  .toggle-btn.active { color: var(--text-primary); }
  .toggle-btn:not(.active):hover { color: #888; }
  .toggle-btn svg { width: 13px; height: 13px; }

  .divider {
    width: 1px;
    background: var(--divider);
    flex-shrink: 0;
    align-self: stretch;
  }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: #fff;
    overflow-y: auto;
    padding: 32px 26px;
  }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: #eee; }

  .sidebar h1 {
    font-size: 19px; font-weight: 500;
    letter-spacing: -0.01em; line-height: 1.3;
    margin-bottom: 24px;
  }

  .sidebar section { margin-bottom: 26px; }

  .sidebar h2 {
    font-size: 10px; font-weight: 400;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--divider);
  }

  .sidebar p {
    font-size: 13px; font-weight: 300;
    line-height: 1.8; color: var(--text-secondary);
  }

  .process-item { display: flex; gap: 12px; margin-bottom: 14px; }
  .process-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 300;
    color: var(--text-muted); min-width: 18px; padding-top: 2px;
  }
  .process-title { font-size: 12.5px; font-weight: 500; margin-bottom: 3px; color: var(--text-primary); }
  .process-desc { font-size: 12px; font-weight: 300; color: var(--text-secondary); line-height: 1.7; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11.5px; font-weight: 300;
    padding: 4px 10px;
    border: 1px solid #ddd;
    color: var(--text-secondary);

  }
  .tag:hover { border-color: #aaa; color: var(--text-primary); }
  .tag.active { background: #111; color: #fff; border-color: #111; }

  @media (max-width: 768px) {
    html, body { overflow: auto; }
    .layout { flex-direction: column; height: auto; overflow: visible; }
    .viewer { height: 60vw; min-height: 260px; flex-shrink: 0; }
    .divider { width: auto; height: 1px; align-self: auto; }
    .grid-page { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
    .sidebar { width: 100%; padding: 24px 18px; }
    :root { --sidebar-w: 100%; }
  }

  @media (max-width: 480px) {
    .grid-page { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
    .viewer { height: 68vw; }
  }
</style>

  const TALL_RATIO = 3;
  const GRID_PER_PAGE = window.innerWidth <= 768 ? 4 : 20;

  let current = 0;
  let isGrid = false;
  let gridPage = 0;
  let activeCategory = null;  // null = 全部

  function filteredImages() {
    return activeCategory ? images.filter(img => img.category === activeCategory) : images;
  }

  const mainImg       = document.getElementById('mainImg');
  const currentPageEl = document.getElementById('currentPage');
  const totalPagesEl  = document.getElementById('totalPages');
  const pageCatEl     = document.getElementById('pageCategory');
  const prevBtn       = document.getElementById('prevBtn');
  const nextBtn       = document.getElementById('nextBtn');
  const singleView    = document.getElementById('singleView');
  const gridView      = document.getElementById('gridView');
  const singleToggle  = document.getElementById('singleToggle');
  const gridToggle    = document.getElementById('gridToggle');
  const scrollHint    = document.getElementById('scrollHint');

  // ── Scroll hint 定位 ──
  function positionScrollHint() {
    const rect = singleView.getBoundingClientRect();
    scrollHint.style.bottom = (window.innerHeight - rect.bottom + 14) + 'px';
    scrollHint.style.left   = rect.left + 'px';
    scrollHint.style.right  = (window.innerWidth - rect.right) + 'px';
  }

  // ── 長條圖偵測 ──
  function applyTallMode(img) {
    const ratio = img.naturalHeight / img.naturalWidth;
    if (ratio > TALL_RATIO) {
      singleView.classList.add('tall-mode');
      singleView.scrollTop = 0;
      positionScrollHint();
      scrollHint.classList.remove('hidden');
      singleView.addEventListener('scroll', onSingleScroll, { passive: true });
    } else {
      singleView.classList.remove('tall-mode');
      scrollHint.classList.add('hidden');
      singleView.removeEventListener('scroll', onSingleScroll);
    }
  }

  function onSingleScroll() {
    if (singleView.scrollTop > 40) scrollHint.classList.add('hidden');
  }

  // ── Render grid page (filtered) ──
  function renderGridPage(page) {
    gridView.innerHTML = '';
    const list = filteredImages();
    const grid = document.createElement('div');
    grid.className = 'grid-page';

    const start = page * GRID_PER_PAGE;
    const end = Math.min(start + GRID_PER_PAGE, list.length);

    for (let i = start; i < end; i++) {
      const img = list[i];
      const realIndex = images.indexOf(img);
      const thumb = document.createElement('div');
      thumb.className = 'grid-thumb' + (realIndex === current ? ' active' : '');
      thumb.innerHTML = `<img src="${img.src}" alt="縮圖" loading="lazy"><span class="thumb-num">${i + 1}</span>`;
      thumb.addEventListener('click', () => { goTo(realIndex); switchToSingle(); });
      grid.appendChild(thumb);
    }

    gridView.appendChild(grid);
  }

  // ── Single-view navigation (filtered) ──
  function goTo(realIndex) {
    current = Math.max(0, Math.min(images.length - 1, realIndex));
    const list = filteredImages();
    const posInList = list.indexOf(images[current]);
    currentPageEl.textContent = posInList + 1;
    totalPagesEl.textContent = list.length;
    pageCatEl.textContent = images[current].category;
    prevBtn.disabled = posInList <= 0;
    nextBtn.disabled = posInList >= list.length - 1;

    mainImg.classList.remove('loaded');
    mainImg.src = images[current].src;
    mainImg.onload = () => {
      mainImg.classList.add('loaded');
      applyTallMode(mainImg);
    };

    mainImg.style.cursor = images[current].link ? 'pointer' : 'default';
    mainImg.onclick = images[current].link
      ? () => window.open(images[current].link, '_blank')
      : null;
  }

  function switchToSingle() {
    isGrid = false;
    singleView.style.display = 'flex';
    gridView.classList.remove('active');
    singleToggle.classList.add('active');
    gridToggle.classList.remove('active');
    goTo(current);
  }

  function switchToGrid() {
    isGrid = true;
    const list = filteredImages();
    const posInList = list.indexOf(images[current]);
    gridPage = Math.max(0, Math.floor((posInList >= 0 ? posInList : 0) / GRID_PER_PAGE));
    singleView.style.display = 'none';
    gridView.classList.add('active');
    singleToggle.classList.remove('active');
    gridToggle.classList.add('active');
    renderGridPage(gridPage);
    updateGridCounter();
  }

  function updateGridCounter() {
    const list = filteredImages();
    const totalGridPages = Math.ceil(list.length / GRID_PER_PAGE);
    currentPageEl.textContent = gridPage + 1;
    totalPagesEl.textContent = totalGridPages;
    pageCatEl.textContent = '';
    prevBtn.disabled = gridPage === 0;
    nextBtn.disabled = gridPage >= totalGridPages - 1;
  }

  // ── Tag filter ──
  document.querySelectorAll('#filterTags .tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const cat = tag.dataset.category;
      if (activeCategory === cat) {
        activeCategory = null;
        tag.classList.remove('active');
      } else {
        activeCategory = cat;
        document.querySelectorAll('#filterTags .tag').forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
      }
      const list = filteredImages();
      if (list.length > 0) current = images.indexOf(list[0]);
      gridPage = 0;
      if (isGrid) { renderGridPage(gridPage); updateGridCounter(); }
      else { goTo(current); }
    });
  });

  prevBtn.addEventListener('click', () => {
    if (isGrid) {
      if (gridPage > 0) { gridPage--; renderGridPage(gridPage); updateGridCounter(); }
    } else {
      const list = filteredImages();
      const pos = list.indexOf(images[current]);
      if (pos > 0) goTo(images.indexOf(list[pos - 1]));
    }
  });
  nextBtn.addEventListener('click', () => {
    if (isGrid) {
      const list = filteredImages();
      const totalGridPages = Math.ceil(list.length / GRID_PER_PAGE);
      if (gridPage < totalGridPages - 1) { gridPage++; renderGridPage(gridPage); updateGridCounter(); }
    } else {
      const list = filteredImages();
      const pos = list.indexOf(images[current]);
      if (pos < list.length - 1) goTo(images.indexOf(list[pos + 1]));
    }
  });

  singleToggle.addEventListener('click', switchToSingle);
  gridToggle.addEventListener('click', switchToGrid);

  window.addEventListener('resize', () => {
    if (!scrollHint.classList.contains('hidden')) positionScrollHint();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') prevBtn.click();
    if (e.key === 'ArrowRight') nextBtn.click();
  });

  goTo(0);
  switchToGrid();
</script>
</body>
</html>
