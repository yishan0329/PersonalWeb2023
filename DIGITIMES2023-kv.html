    :root {
      --bg: #ffffff;
      --divider: #e8e8e8;
      --text-primary: #111111;
      --text-secondary: #666666;
      --text-muted: #aaaaaa;
      --nav-h: 44px;
      --sidebar-w: 320px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      overflow: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #fff;
      z-index: 100;
    }

    .nav-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    .nav-breadcrumb a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color .15s;
    }

    .nav-breadcrumb a:hover {
      color: var(--text-primary);
    }

    .nav-sep {
      color: #ddd;
    }

    .nav-home {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: color .15s;
    }

    .nav-home:hover {
      color: var(--text-primary);
    }

    .nav-home svg {
      width: 14px;
      height: 14px;
    }

    .layout {
      display: flex;
      height: 100vh;
      padding-top: var(--nav-h);
    }

    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    .single-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
      background: #fff;
    }

    .single-view img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity .3s ease;
    }

    .single-view img.loaded {
      opacity: 1;
    }

    .grid-view {
      flex: 1;
      overflow: hidden;
      padding: 16px 16px 0;
      display: none;
      flex-direction: column;
      background: #fff;
    }

    .grid-view.active {
      display: flex;
    }

    .grid-page {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 20px;
      flex: 1;
      min-height: 0;
    }

    .grid-thumb {
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: opacity .15s;
      min-height: 0;
      border-radius: 10px;
    }

    .grid-thumb:hover {
      opacity: 0.75;
    }

    .grid-thumb.active img {
      outline: 1.5px solid #111;
      outline-offset: -1.5px;
    }

    .grid-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid-thumb .thumb-num {
      position: absolute;
      bottom: 4px;
      right: 5px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 300;
      color: rgba(0, 0, 0, 0.4);
      background: rgba(255, 255, 255, 0.7);
      padding: 1px 4px;
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #fff;
      flex-shrink: 0;
    }

    .nav-arrows {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arrow-btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s;
      padding: 0;
    }

    .arrow-btn:hover:not(:disabled) {
      color: var(--text-primary);
    }

    .arrow-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .page-counter {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      min-width: 52px;
      text-align: center;
    }

    .page-counter .cur {
      color: var(--text-primary);
    }

    /* Category badge next to counter */
    .page-category {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .view-toggle {
      display: flex;
      gap: 2px;
    }

    .toggle-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s;
      border-radius: 3px;
    }

    .toggle-btn.active {
      color: var(--text-primary);
    }

    .toggle-btn:not(.active):hover {
      color: #888;
    }

    .toggle-btn svg {
      width: 13px;
      height: 13px;
    }

    .divider {
      width: 1px;
      background: var(--divider);
      flex-shrink: 0;
      align-self: stretch;
    }

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: #fff;
      overflow-y: auto;
      padding: 32px 26px;
    }

    .sidebar::-webkit-scrollbar {
      width: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #eee;
    }

    .sidebar h1 {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 24px;
    }

    .sidebar section {
      margin-bottom: 26px;
    }

    .sidebar h2 {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--divider);
    }

    .sidebar p {
      font-size: 13px;
      font-weight: 300;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    .tag {
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .tag.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .process-item {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }

    .process-num {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      color: var(--text-muted);
      min-width: 18px;
      padding-top: 2px;
    }

    .process-title {
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 3px;
      color: var(--text-primary);
    }

    .process-desc {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11.5px;
      font-weight: 300;
      padding: 4px 10px;
      border: 1px solid #ddd;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {

        overflow: auto;

        flex-direction: column;
        height: auto;

      .divider {
        width: auto;
        height: 1px;
        align-self: auto;

        grid-template-rows: repeat(2, 1fr);

      .sidebar {
        width: 100%;
        padding: 24px 18px;

      }
    }

    @media (max-width: 480px) {

        grid-template-rows: repeat(2, 1fr);
      }

        height: 68vw;

  </style>
</head>

      { src: 'img/digitimes/kv/no_use/LINE_ALBUM_kv未用到_260607_35.jpg', category: '其他' },
      { src: 'img/digitimes/kv/no_use/LINE_ALBUM_kv未用到_260607_36.jpg', category: '其他' },
      { src: 'img/digitimes/kv/2026_4to6/LINE_ALBUM_kv_260607_5.jpg', category: '企業識別與活動視覺' },
    ];

    const GRID_PER_PAGE = window.innerWidth <= 768 ? 4 : 20;
    const total = images.length;

    let current = 0;
    let isGrid = false;
    let gridPage = 0;
    let activeCategory = null;   // null = 全部顯示

    // 依 activeCategory 過濾後的圖片清單
    function filteredImages() {
      return activeCategory ? images.filter(img => img.category === activeCategory) : images;
    }

    const mainImg = document.getElementById('mainImg');
    const currentPageEl = document.getElementById('currentPage');
    const totalPagesEl = document.getElementById('totalPages');
    const pageCatEl = document.getElementById('pageCategory');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const singleView = document.getElementById('singleView');
    const gridView = document.getElementById('gridView');
    const singleToggle = document.getElementById('singleToggle');
    const gridToggle = document.getElementById('gridToggle');

    totalPagesEl.textContent = total;

    // ── Render grid page (from filtered list) ──
    function renderGridPage(page) {
      gridView.innerHTML = '';
      const list = filteredImages();
      const totalGridPages = Math.ceil(list.length / GRID_PER_PAGE);
      const grid = document.createElement('div');
      grid.className = 'grid-page';

      const start = page * GRID_PER_PAGE;
      const end = Math.min(start + GRID_PER_PAGE, list.length);

      for (let i = start; i < end; i++) {
        const img = list[i];
        const realIndex = images.indexOf(img);
        const thumb = document.createElement('div');
        thumb.className = 'grid-thumb' + (realIndex === current ? ' active' : '');
        thumb.innerHTML = `<img src="${img.src}" alt="縮圖" loading="lazy">`;
        thumb.addEventListener('click', () => { goTo(realIndex); switchToSingle(); });
        grid.appendChild(thumb);
      }

      gridView.appendChild(grid);
    }

    // ── Single-view navigation (within filtered list) ──
    function goTo(realIndex) {
      current = Math.max(0, Math.min(images.length - 1, realIndex));
      const list = filteredImages();
      const posInList = list.indexOf(images[current]);
      currentPageEl.textContent = posInList + 1;
      totalPagesEl.textContent = list.length;
      pageCatEl.textContent = images[current].category;
      prevBtn.disabled = posInList <= 0;
      nextBtn.disabled = posInList >= list.length - 1;

      mainImg.classList.remove('loaded');
      mainImg.src = images[current].src;
      mainImg.onload = () => mainImg.classList.add('loaded');

      mainImg.style.cursor = images[current].link ? 'pointer' : 'default';
      mainImg.onclick = images[current].link
        ? () => window.open(images[current].link, '_blank')
        : null;
    }

    function switchToSingle() {
      isGrid = false;
      singleView.style.display = 'flex';
      gridView.classList.remove('active');
      singleToggle.classList.add('active');
      gridToggle.classList.remove('active');
      goTo(current);
    }

    function switchToGrid() {
      isGrid = true;
      const list = filteredImages();
      const posInList = list.indexOf(images[current]);
      gridPage = Math.max(0, Math.floor((posInList >= 0 ? posInList : 0) / GRID_PER_PAGE));
      singleView.style.display = 'none';
      gridView.classList.add('active');
      singleToggle.classList.remove('active');
      gridToggle.classList.add('active');
      renderGridPage(gridPage);
      updateGridCounter();
    }

    function updateGridCounter() {
      const list = filteredImages();
      const totalGridPages = Math.ceil(list.length / GRID_PER_PAGE);
      currentPageEl.textContent = gridPage + 1;
      totalPagesEl.textContent = totalGridPages;
      pageCatEl.textContent = '';
      prevBtn.disabled = gridPage === 0;
      nextBtn.disabled = gridPage >= totalGridPages - 1;
    }

    // ── Tag filter ──
    document.querySelectorAll('#filterTags .tag').forEach(tag => {
      tag.addEventListener('click', () => {
        const cat = tag.dataset.category;
        if (activeCategory === cat) {
          // 再按一次取消篩選
          activeCategory = null;
          tag.classList.remove('active');
        } else {
          activeCategory = cat;
          document.querySelectorAll('#filterTags .tag').forEach(t => t.classList.remove('active'));
          tag.classList.add('active');
        }
        // 重設到過濾後第一張
        const list = filteredImages();
        if (list.length > 0) {
          current = images.indexOf(list[0]);
        }
        gridPage = 0;
        if (isGrid) {
          renderGridPage(gridPage);
          updateGridCounter();
        } else {
          goTo(current);
        }
      });
    });

    prevBtn.addEventListener('click', () => {
      if (isGrid) {
        if (gridPage > 0) { gridPage--; renderGridPage(gridPage); updateGridCounter(); }
      } else {
        const list = filteredImages();
        const pos = list.indexOf(images[current]);
        if (pos > 0) goTo(images.indexOf(list[pos - 1]));
      }
    });
    nextBtn.addEventListener('click', () => {
      if (isGrid) {
        const list = filteredImages();
        const totalGridPages = Math.ceil(list.length / GRID_PER_PAGE);
        if (gridPage < totalGridPages - 1) { gridPage++; renderGridPage(gridPage); updateGridCounter(); }
      } else {
        const list = filteredImages();
        const pos = list.indexOf(images[current]);
        if (pos < list.length - 1) goTo(images.indexOf(list[pos + 1]));
      }
    });

    singleToggle.addEventListener('click', switchToSingle);
    gridToggle.addEventListener('click', switchToGrid);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') prevBtn.click();
      if (e.key === 'ArrowRight') nextBtn.click();
    });

    goTo(0);
    switchToGrid();
  </script>
</body>

</html>
