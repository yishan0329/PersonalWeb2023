  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --speed: 0.55s;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --radius: 16px;
      --gray: #666666;
      --light-gray: #f5f5f5;
      --border: #e0e0e0;
    }

    html,
    body {
      height: 100%;
      background: #fff;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }


    /* ── PAGE TITLE ── */
    .page-title-row {
      padding: 32px 40px 20px;
      text-align: center;
    }

    .page-title-row h2 {
      font-size: 36px;
      font-weight: bold;
      color: #666;
    }

    .page-title-row hr {
      margin-top: 12px;
      border: none;
      border-top: 1px solid #ddd;
    }

    /* ── ACCORDION ──  視窗高度減去上方 header 的空間*/
    .accordion-wrap {
      display: flex;
      gap: 12px;
      padding: 12px 32px 48px;
      height: calc(100vh - 360px);
      min-height: 480px;
    }

    .panel {
      flex: 1;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: flex var(--speed) var(--ease);
      background: var(--light-gray);
      border: 1px solid var(--border);
    }

    /* hover: hovered expands, others shrink */
    .accordion-wrap:has(.panel:hover) .panel {
      flex: 0.3;
    }

    .accordion-wrap:has(.panel:hover) .panel:hover {
      flex: 3.5;
    }

    /* ── IMAGE ── */
    .panel-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      border-radius: var(--radius);
      transition: transform var(--speed) var(--ease),
        filter var(--speed) var(--ease);
      filter: brightness(0.82);
    }

    .panel:hover .panel-img {
      transform: scale(1.03);
      filter: brightness(0.65);
    }

    /* ── COLLAPSED: vertical label ── */
    .label-vert {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #fff;
      white-space: nowrap;
      z-index: 3;
      transition: opacity var(--speed) var(--ease);
    }

    .panel:hover .label-vert {
      opacity: 0;
      pointer-events: none;
    }

    /* ── EXPANDED: info overlay ── */
    .panel-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, transparent 75%);
      border-radius: var(--radius);
    }

    .panel-info {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s var(--ease) 0.15s,
        transform 0.38s var(--ease) 0.15s;
      pointer-events: none;
    }

    .panel:hover .panel-info {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .panel-cat {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 6px;
    }

    .panel-name {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .panel-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.06em;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    /* ── THUMBNAIL ROW (top of expanded panel) ── */
    .thumb-row {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 4;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.4s var(--ease) 0.2s,
        transform 0.4s var(--ease) 0.2s;
      pointer-events: none;
      overflow: hidden;
    }

    .panel:hover .thumb-row {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .thumb-row img {
      width: 72px;
      height: 52px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      flex-shrink: 0;
      transition: transform 0.25s;
    }

    .thumb-row img:hover {
      transform: scale(1.07);
    }

    /* ── ENTER BUTTON ── */
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: #fff;
      border: none;
      border-radius: 999px;
      color: #222;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.25s, color 0.25s, transform 0.2s;
      width: fit-content;
    }

    .btn-enter:hover {
      background: #222;
      color: #fff;
      transform: translateX(2px);
    }



    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .accordion-wrap {
        flex-direction: column;
        height: auto;
        padding: 12px 16px 40px;
      }

      .panel {
        flex: none !important;
        height: 200px;
        width: 100%;
      }

      .accordion-wrap:has(.panel:hover) .panel {
        flex: none;
        height: 180px;
      }

      .accordion-wrap:has(.panel:hover) .panel:hover {
        flex: none;
        height: 400px;
      }

      .label-vert {
        writing-mode: horizontal-tb;
        bottom: auto;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .thumb-row {
        top: 12px;
      }
    }
  </style>
</head>
