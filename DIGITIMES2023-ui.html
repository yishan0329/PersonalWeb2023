<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="img/favicon.ico">
  <title>YISHAN – DIGITIMES視覺設計作品集</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap');

    :root {
      --bg: #ffffff;
      --divider: #e8e8e8;
      --text-primary: #111111;
      --text-secondary: #666666;
      --text-muted: #aaaaaa;
      --nav-h: 44px;
      --sidebar-w: 320px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      overflow: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #fff;
      z-index: 100;
    }

    .nav-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    .nav-breadcrumb a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color .15s;
    }

    .nav-breadcrumb a:hover {
      color: var(--text-primary);
    }

    .nav-sep {
      color: #ddd;
    }

    .nav-home {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: color .15s;
    }

    .nav-home:hover {
      color: var(--text-primary);
    }

    .nav-home svg {
      width: 14px;
      height: 14px;
    }

    .layout {
      display: flex;
      height: 100vh;
      padding-top: var(--nav-h);
    }

    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    .single-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }

    /* 長條圖模式：遮罩框 + 可捲動 */
    .single-view.tall-mode {
      align-items: flex-start;
      overflow-y: auto;
      padding: 0;
      scrollbar-width: thin;
      scrollbar-color: #ddd transparent;
    }

    .single-view.tall-mode::-webkit-scrollbar {
      width: 4px;
    }

    .single-view.tall-mode::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 2px;
    }

    /* 遮罩框容器 */
    .tall-mask {
      width: 100%;
      position: relative;
      flex-shrink: 0;
    }

    .single-view img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity .3s ease;
      border-radius: 16px; /* 圓角遮罩 */
    }

    .single-view img.loaded {
      opacity: 1;
    }

    /* 長條圖模式下的 img */
    .single-view.tall-mode img {
      width: 80%;
      max-height: none;
      object-fit: contain;
      border-radius: 16px;
    }

    /* scroll hint：fixed 懸浮在 singleView 下方邊緣 */
    .scroll-hint {
      position: fixed;
      left: 0;
      /* width 跟隨 viewer，由 JS 動態設定 right */
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 50;
      opacity: 1;
      transition: opacity .4s ease;
    }

    .scroll-hint.hidden {
      opacity: 0;
    }

    .scroll-hint-inner {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .scroll-hint-inner svg {
      width: 10px;
      height: 10px;
      animation: bounceDown .9s ease-in-out infinite;
    }

    @keyframes bounceDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }

    .grid-view {
      flex: 1;
      overflow: hidden;
      padding: 16px 16px 0;
      display: none;
      flex-direction: column;
      background: #fff;
    }

    .grid-view.active {
      display: flex;
    }

    .grid-page {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      flex: 1;
      min-height: 0;
    }

    .grid-thumb {
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: opacity .15s;
      min-height: 0;
      border-radius: 10px;
    }

    .grid-thumb:hover {
      opacity: 0.75;
    }

    .grid-thumb.active img {
      outline: 1.5px solid #111;
      outline-offset: -1.5px;
    }

    .grid-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      object-position: center top;
    }

    .grid-thumb .thumb-num {
      position: absolute;
      bottom: 4px;
      right: 5px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 300;
      color: rgba(0, 0, 0, 0.4);
      background: rgba(255, 255, 255, 0.7);
      padding: 1px 4px;
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #fff;
      flex-shrink: 0;
    }

    .nav-arrows {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arrow-btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s;
      padding: 0;
    }

    .arrow-btn:hover:not(:disabled) {
      color: var(--text-primary);
    }

    .arrow-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .page-counter {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      min-width: 52px;
      text-align: center;
    }

    .page-counter .cur {
      color: var(--text-primary);
    }

    /* Category badge next to counter */
    .page-category {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .view-toggle {
      display: flex;
      gap: 2px;
    }

    .toggle-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s;
      border-radius: 3px;
    }

    .toggle-btn.active {
      color: var(--text-primary);
    }

    .toggle-btn:not(.active):hover {
      color: #888;
    }

    .toggle-btn svg {
      width: 13px;
      height: 13px;
    }

    .divider {
      width: 1px;
      background: var(--divider);
      flex-shrink: 0;
      align-self: stretch;
    }

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: #fff;
      overflow-y: auto;
      padding: 32px 26px;
    }

    .sidebar::-webkit-scrollbar {
      width: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #eee;
    }

    .sidebar h1 {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 24px;
    }

    .sidebar section {
      margin-bottom: 26px;
    }

    .sidebar h2 {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--divider);
    }

    .sidebar p {
      font-size: 13px;
      font-weight: 300;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    .tag {
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .tag.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .process-item {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }

    .process-num {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      color: var(--text-muted);
      min-width: 18px;
      padding-top: 2px;
    }

    .process-title {
      font-size: 12.5px;
      font-weight: 500;
      margin-bottom: 3px;
      color: var(--text-primary);
    }

    .process-desc {
      font-size: 12px;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11.5px;
      font-weight: 300;
      padding: 4px 10px;
      border: 1px solid #ddd;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {

      html,
      body {
        overflow: auto;
      }

      .layout {
        flex-direction: column;
        height: auto;
        overflow: visible;
      }

      .viewer {
        height: 60vw;
        min-height: 260px;
        flex-shrink: 0;
      }

      .divider {
        width: auto;
        height: 1px;
        align-self: auto;
      }

      .grid-page {
        grid-template-columns: repeat(1, 1fr);
      }

      .sidebar {
        width: 100%;
        padding: 24px 18px;
      }

      :root {
        --sidebar-w: 100%;
      }

      /* 手機版隱藏格狀瀏覽切換 */
      #gridToggle {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .grid-page {
        grid-template-columns: repeat(1, 1fr);
      }

      .viewer {
        height: 68vw;
      }

      #gridToggle {
        display: none;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-breadcrumb">
      <a href="index.html" target="_blank" rel="noopener">蔡宜珊</a>
      <span class="nav-sep">/</span>
      <a href="DIGITIMES2023-index.html" target="_blank" rel="noopener">2023–DIGITIMES 視覺設計</a>
    </div>
    <a href="index.html" class="nav-home" title="首頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" />
        <path d="M9 21V12h6v9" />
      </svg>
    </a>
  </nav>

  <div class="layout">
    <div class="viewer">
      <div class="single-view" id="singleView">
        <img id="mainImg" src="" alt="作品圖片" />
        <div class="scroll-hint hidden" id="scrollHint">
          <div class="scroll-hint-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9" transform="rotate(0)" />
            </svg>
            scroll
          </div>
        </div>
      </div>
      <div class="grid-view" id="gridView"></div>

      <div class="viewer-controls">
        <div class="nav-arrows">
          <button class="arrow-btn" id="prevBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <div class="page-counter"><span class="cur" id="currentPage">1</span> / <span id="totalPages">-</span></div>
          <button class="arrow-btn" id="nextBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
          <span class="page-category" id="pageCategory"></span>
        </div>
        <div class="view-toggle">
          <button class="toggle-btn active" id="singleToggle" title="單圖瀏覽">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="1" />
            </svg>
          </button>
          <button class="toggle-btn" id="gridToggle" title="格狀瀏覽">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <aside class="sidebar">
      <h1>網頁設計</h1>
      <section>
        <h2>專案說明</h2>
        <p>負責活動網站、品牌形象網站及互動頁面之規劃與設計，從資訊架構、視覺風格到頁面版型配置，建立兼具識別與使用體驗的網頁介面，提升瀏覽體驗。</p>
      </section>
      <section>
        <h2>設計流程</h2>
        <div class="process-item">
          <div class="process-num">01</div>
          <div>
            <div class="process-title">需求分析</div>
            <div class="process-desc">與專案團隊討論網站目標、受眾需求及內容架構，釐清網站功能與使用情境，建立整體規劃方向。</div>
          </div>
        </div>
        <div class="process-item">
          <div class="process-num">02</div>
          <div>
            <div class="process-title">介面設計</div>
            <div class="process-desc">運用 Figma、Illustrator等工具進行頁面製作與響應式版面調整，確保跨裝置瀏覽體驗一致。</div>
          </div>
        </div>
        <div class="process-item">
          <div class="process-num">03</div>
          <div>
            <div class="process-title">交付前端</div>
            <div class="process-desc">將檔案交付給網頁設計師，並依照回饋調整。</div>
          </div>
        </div>
      </section>
      <section>
        <h2>製作項目</h2>
        <div class="tags" id="filterTags">
          <span class="tag" data-category="企業識別與活動視覺">活動與產品</span>
          <span class="tag" data-category="外部委託視覺">外部委託</span>
          <span class="tag" data-category="IC之音">IC之音</span>
        </div>
      </section>
    </aside>
  </div>

  <script>
    // ── IMAGE DATA ──
    // Each entry: { src, category, link (optional) }
    const images = [
      // =====================
      // 2025
      // =====================
      { src: 'img/digitimes/ad/edm/2025_10to12/1206新竹國際教育展.jpg', category: 'IC之音' },
      { src: 'img/digitimes/ad/edm/2025_4to6/夏日出走web.jpg', category: 'IC之音' },
      { src: 'img/digitimes/ad/edm/2025_4to6/大智若魚-web.jpg', category: 'IC之音' },
      { src: 'img/digitimes/ad/edm/2025_4to6/商周產品web.jpg', category: '企業識別與活動視覺' },
      { src: 'img/digitimes/ad/edm/2025_4to6/digikey-web-a.jpg', category: '外部委託視覺' },
      { src: 'img/digitimes/ad/edm/2025_4to6/digikey-web-b.jpg', category: '外部委託視覺' },

      // =====================
      // 2024
      // =====================
      { src: 'img/digitimes/ad/edm/2024_10to12/網頁layout.jpg', category: '企業識別與活動視覺' },
      { src: 'img/digitimes/ad/edm/2024_7to9/網頁.jpg', category: 'IC之音' },
      { src: 'img/digitimes/ad/edm/2024_4to6/ic萌寵網頁.jpg', category: 'IC之音' },
      { src: 'img/digitimes/ad/edm/2024_1to3/網頁layout.jpg', category: '企業識別與活動視覺' },
    ];

    const TALL_RATIO = 1.5; // 高寬比超過此值視為長條圖
    const GRID_PER_PAGE = window.innerWidth <= 768 ? 4 : 3;
    const total = images.length;

    let current = 0;
    let isGrid = false;
    let gridPage = 0;
    let activeCategory = null;

    function filteredImages() {
      return activeCategory ? images.filter(img => img.category === activeCategory) : images;
    }

    const mainImg = document.getElementById('mainImg');
    const currentPageEl = document.getElementById('currentPage');
    const totalPagesEl = document.getElementById('totalPages');
    const pageCatEl = document.getElementById('pageCategory');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const singleView = document.getElementById('singleView');
    const gridView = document.getElementById('gridView');
    const singleToggle = document.getElementById('singleToggle');
    const gridToggle = document.getElementById('gridToggle');
    const scrollHint = document.getElementById('scrollHint');

    totalPagesEl.textContent = total;

    function positionScrollHint() {
      const rect = singleView.getBoundingClientRect();
      scrollHint.style.bottom = (window.innerHeight - rect.bottom + 14) + 'px';
      scrollHint.style.left   = rect.left + 'px';
      scrollHint.style.right  = (window.innerWidth - rect.right) + 'px';
    }

    // ── 長條圖偵測與模式切換 ──
    function applyTallMode(img) {
      const ratio = img.naturalHeight / img.naturalWidth;
      if (ratio > TALL_RATIO) {
        singleView.classList.add('tall-mode');
        singleView.scrollTop = 0;
        positionScrollHint();
        scrollHint.classList.remove('hidden');
        singleView.addEventListener('scroll', onSingleScroll, { passive: true });
      } else {
        singleView.classList.remove('tall-mode');
        scrollHint.classList.add('hidden');
        singleView.removeEventListener('scroll', onSingleScroll);
      }
    }

    function onSingleScroll() {
      if (singleView.scrollTop > 40) {
        scrollHint.classList.add('hidden');
      }
    }

    // ── Render grid page (from filtered list) ──
    function renderGridPage(page) {
      gridView.innerHTML = '';
      const list = filteredImages();
      const totalGridPages = Math.ceil(list.length / GRID_PER_PAGE);
      const grid = document.createElement('div');
      grid.className = 'grid-page';

      const start = page * GRID_PER_PAGE;
      const end = Math.min(start + GRID_PER_PAGE, list.length);

      for (let i = start; i < end; i++) {
        const img = list[i];
        const realIndex = images.indexOf(img);
        const thumb = document.createElement('div');
        thumb.className = 'grid-thumb' + (realIndex === current ? ' active' : '');
        thumb.innerHTML = `<img src="${img.src}" alt="縮圖" loading="lazy">`;
        thumb.addEventListener('click', () => { goTo(realIndex); switchToSingle(); });
        grid.appendChild(thumb);
      }

      gridView.appendChild(grid);
    }

    // ── Single-view navigation (within filtered list) ──
    function goTo(realIndex) {
      current = Math.max(0, Math.min(images.length - 1, realIndex));
      const list = filteredImages();
      const posInList = list.indexOf(images[current]);
      currentPageEl.textContent = posInList + 1;
      totalPagesEl.textContent = list.length;
      pageCatEl.textContent = images[current].category;
      prevBtn.disabled = posInList <= 0;
      nextBtn.disabled = posInList >= list.length - 1;

      mainImg.classList.remove('loaded');
      mainImg.src = images[current].src;
      mainImg.onload = () => {
        mainImg.classList.add('loaded');
        applyTallMode(mainImg);
      };

      mainImg.style.cursor = images[current].link ? 'pointer' : 'default';
      mainImg.onclick = images[current].link
        ? () => window.open(images[current].link, '_blank')
        : null;
    }

    function switchToSingle() {
      isGrid = false;
      singleView.style.display = 'flex';
      gridView.classList.remove('active');
      singleToggle.classList.add('active');
      gridToggle.classList.remove('active');
      goTo(current);
    }

    function switchToGrid() {
      isGrid = true;
      const list = filteredImages();
      const posInList = list.indexOf(images[current]);
      gridPage = Math.max(0, Math.floor((posInList >= 0 ? posInList : 0) / GRID_PER_PAGE));
      singleView.style.display = 'none';
      gridView.classList.add('active');
      singleToggle.classList.remove('active');
      gridToggle.classList.add('active');
      renderGridPage(gridPage);
      updateGridCounter();
    }

    function updateGridCounter() {
      const list = filteredImages();
      const totalGridPages = Math.ceil(list.length / GRID_PER_PAGE);
      currentPageEl.textContent = gridPage + 1;
      totalPagesEl.textContent = totalGridPages;
      pageCatEl.textContent = '';
      prevBtn.disabled = gridPage === 0;
      nextBtn.disabled = gridPage >= totalGridPages - 1;
    }

    // ── Tag filter ──
    document.querySelectorAll('#filterTags .tag').forEach(tag => {
      tag.addEventListener('click', () => {
        const cat = tag.dataset.category;
        if (activeCategory === cat) {
          // 再按一次取消篩選
          activeCategory = null;
          tag.classList.remove('active');
        } else {
          activeCategory = cat;
          document.querySelectorAll('#filterTags .tag').forEach(t => t.classList.remove('active'));
          tag.classList.add('active');
        }
        // 重設到過濾後第一張
        const list = filteredImages();
        if (list.length > 0) {
          current = images.indexOf(list[0]);
        }
        gridPage = 0;
        if (isGrid) {
          renderGridPage(gridPage);
          updateGridCounter();
        } else {
          goTo(current);
        }
      });
    });

    prevBtn.addEventListener('click', () => {
      if (isGrid) {
        if (gridPage > 0) { gridPage--; renderGridPage(gridPage); updateGridCounter(); }
      } else {
        const list = filteredImages();
        const pos = list.indexOf(images[current]);
        if (pos > 0) goTo(images.indexOf(list[pos - 1]));
      }
    });
    nextBtn.addEventListener('click', () => {
      if (isGrid) {
        const list = filteredImages();
        const totalGridPages = Math.ceil(list.length / GRID_PER_PAGE);
        if (gridPage < totalGridPages - 1) { gridPage++; renderGridPage(gridPage); updateGridCounter(); }
      } else {
        const list = filteredImages();
        const pos = list.indexOf(images[current]);
        if (pos < list.length - 1) goTo(images.indexOf(list[pos + 1]));
      }
    });

    singleToggle.addEventListener('click', switchToSingle);
    gridToggle.addEventListener('click', switchToGrid);

    window.addEventListener('resize', () => {
      if (!scrollHint.classList.contains('hidden')) positionScrollHint();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') prevBtn.click();
      if (e.key === 'ArrowRight') nextBtn.click();
    });

    goTo(0);
    switchToGrid();
  </script>
</body>

</html>
